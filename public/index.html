<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .icon { font-size: 48px; margin-bottom: 24px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.7;transform:scale(0.95)} }
    h1 { font-size: clamp(22px, 5vw, 32px); font-weight: 700; margin-bottom: 14px; line-height: 1.3; }
    p { font-size: 16px; color: #888; max-width: 480px; line-height: 1.6; margin-bottom: 48px; }
    .countdown { display: flex; gap: 16px; align-items: center; justify-content: center; margin-bottom: 40px; }
    .countdown-block { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px 24px; min-width: 90px; }
    .countdown-block .num { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .countdown-block .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #555; margin-top: 6px; }
    .countdown-sep { font-size: 32px; font-weight: 700; color: #333; margin-bottom: 20px; }
    .status-bar { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px 20px; font-size: 13px; color: #555; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: blink 1.5s ease-in-out infinite; flex-shrink: 0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @media (max-width: 480px) {
      .countdown { gap: 8px; }
      .countdown-block { min-width: 70px; padding: 16px 14px; }
      .countdown-block .num { font-size: 30px; }
      .countdown-sep { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="icon">⚙️</div>
  <h1>We'll Be Back Shortly</h1>
  <p>Our checkout is temporarily down for maintenance due to an unusually high volume of orders. We're working hard to get everything back up as soon as possible.</p>
  <div class="countdown">
    <div class="countdown-block"><div class="num" id="hours">08</div><div class="label">Hours</div></div>
    <div class="countdown-sep">:</div>
    <div class="countdown-block"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="countdown-sep">:</div>
    <div class="countdown-block"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
  </div>
  <div class="status-bar">
    <div class="status-dot"></div>
    <span>Maintenance in progress — estimated completion in <span id="eta">8 hours</span></span>
  </div>
  <script>
    const END_TIME = 1779168982742 + (8 * 60 * 60 * 1000);
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      const remaining = Math.max(0, END_TIME - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      document.getElementById('hours').textContent = pad(h);
      document.getElementById('minutes').textContent = pad(m);
      document.getElementById('seconds').textContent = pad(s);
      if (remaining === 0) document.getElementById('eta').textContent = 'any moment now';
      else if (h > 0) document.getElementById('eta').textContent = h + ' hour' + (h !== 1 ? 's' : '');
      else if (m > 0) document.getElementById('eta').textContent = m + ' minute' + (m !== 1 ? 's' : '');
      else document.getElementById('eta').textContent = 'less than a minute';
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
